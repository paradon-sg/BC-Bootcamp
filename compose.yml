# Development environment. Usage:
#   docker compose up --build
#   docker compose run --rm web bin/rails console
#
# After changing Gemfile or package.json, rebuild and refresh the volumes:
#   docker compose run --rm web bundle install
#   docker compose run --rm web yarn install

x-app: &app
  image: hotwire-dev
  build:
    context: .
    dockerfile: Dockerfile.dev
  volumes:
    - .:/rails
    - bundle:/usr/local/bundle
    - node_modules:/rails/node_modules

services:
  web:
    <<: *app
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - js
      - css
    stdin_open: true
    tty: true

  js:
    <<: *app
    command: yarn build --watch=forever
  
  css:
    <<: *app
    command: bin/rails tailwindcss:watch[always]

volumes:
  bundle:
  node_modules:
